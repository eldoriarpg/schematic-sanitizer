[versions]
utilities = "3.6.0"
jackson = "3.2.4"
jackson-annotations = "2.22"
fawe = "2.16.1"
palantir = "2.102.0"
publishdata = "2.2.0"
spotless = "8.10.4"

[libraries]
eldoutil-plugin = { module = "de.eldoria.util:plugin", version.ref = "utilities" }
eldoutil-jackson = { module = "de.eldoria.util:jackson-configuration", version.ref = "utilities" }
eldoutil-updater = { module = "de.eldoria.util:updater", version.ref = "utilities" }

jackson-core = { module = "tools.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson-annotations" }

fawe-core = { module = "com.fastasyncworldedit:FastAsyncWorldEdit-Core", version.ref = "fawe" }
fawe-bukkit = { module = "com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit", version.ref = "fawe" }
paper = "io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT"
jetbrains-annotations = "org.jetbrains:annotations:26.1.0"

junit-bom = "org.junit:junit-bom:6.1.3"
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

gradle-publishdata = { module = "de.chojo:publishdata", version.ref = "publishdata" }
gradle-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[bundles]
utilities = ["eldoutil-plugin", "eldoutil-jackson", "eldoutil-updater"]
jackson = ["jackson-core", "jackson-databind", "jackson-yaml", "jackson-annotations"]
fawe = ["fawe-core", "fawe-bukkit"]

[plugins]
shadow = "com.gradleup.shadow:9.6.1"
pluginyml-paper = "de.eldoria.plugin-yml.paper:0.9.0"
hangar = "io.papermc.hangar-publish-plugin:0.1.4"
runpaper = "xyz.jpenilla.run-paper:3.1.0"
minotaur = "com.modrinth.minotaur:2.10.0"
