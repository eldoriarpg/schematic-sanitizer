name: Verify state

on:
  push:
    branches-ignore:
      - main
      - dev*
      - feature/*
      - fix/*
  pull_request:
    types: [ opened, ready_for_review, synchronize ]
  workflow_call:

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build
